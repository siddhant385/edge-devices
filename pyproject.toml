[project]
name = "ibvap"
version = "0.1.0"
description = "CPU-only RTSP to ONNX detection edge client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=5.0.0.93",
    "onnxruntime>=1.20.0",
    "pillow>=10.0.0",
    "psutil>=6.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "supervision>=0.30.0",
    "httpx>=0.28.1",
    "aiofiles>=25.1.0",
    "supabase>=2.31.0",
    "trackers>=2.6.0",
]
